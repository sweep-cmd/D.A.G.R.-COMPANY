<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="D.A.G.R. Company roster: command, platoons, squads, comms card and aspirants.">
<meta property="og:type" content="website">
<meta property="og:title" content="D.A.G.R. Company // Roster">
<meta property="og:description" content="Death Walks Beside Us. Company roster, squads, comms card and aspirants.">
<meta name="theme-color" content="#e7c231">
<title>D.A.G.R. Company // Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Terminal roster sheet: one column of unit sections, cards per squad, slots as rows (role · name · callsign · tier). */
:root{
  --bg:#dfe1d8; --panel:#eaece3; --line:#aab0a2; --text:#1b221f; --dim:#58635d;
  --accent:#8a6d00; --ldr:#1b221f; --vet:#8a6d00; --reg:#1f5f9f; --fng:#5a6f12; --asp:#b3204f;
  --open:#8a948d; --scan:transparent; --focus:#1f5f9f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e0d; --panel:#111615; --line:#26302d; --text:#cfd6cc; --dim:#6b7772;
    --accent:#e7c231; --ldr:#f2f0e6; --vet:#e7c231; --reg:#4a9be0; --fng:#8aa62e; --asp:#e0356b;
    --open:#4d5753; --scan:rgba(231,194,49,.03); --focus:#4a9be0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e0d; --panel:#111615; --line:#26302d; --text:#cfd6cc; --dim:#6b7772;
  --accent:#e7c231; --ldr:#f2f0e6; --vet:#e7c231; --reg:#4a9be0; --fng:#8aa62e; --asp:#e0356b;
  --open:#4d5753; --scan:rgba(231,194,49,.03); --focus:#4a9be0; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Share Tech Mono', ui-monospace, Menlo, Consolas, 'Courier New', monospace;
  font-size:15px; line-height:1.5;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 3px);
}
.wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:28px 16px 72px}
.hd{font-family:'Saira Condensed', 'Arial Narrow', Impact, sans-serif}

/* header */
.prompt{color:var(--dim); margin:0 0 14px; overflow-wrap:anywhere}
.prompt b{color:var(--accent); font-weight:400}
.cursor{display:inline-block; width:.6em; height:1.05em; background:var(--accent); vertical-align:text-bottom; margin-left:2px}
@media (prefers-reduced-motion: no-preference){
  .cursor{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
}
.banner{border:1px solid var(--line); border-left:5px solid var(--accent); background:var(--panel); padding:22px 22px 18px}
.banner h1{margin:0; font-size:clamp(34px,7vw,64px); line-height:1; letter-spacing:.06em; font-weight:700; text-transform:uppercase}
.banner .sub{margin:10px 0 0; color:var(--dim)}
.banner .motto{margin:14px 0 0; color:var(--accent)}

/* stats */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0}
.stat{border:1px solid var(--line); background:var(--panel); padding:10px 14px}
.stat .n{font-family:'Saira Condensed', 'Arial Narrow', Impact, sans-serif; font-size:34px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.stat .l{color:var(--dim); font-size:13px}

/* tools */
.tools{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin:0 0 6px}
.search{flex:1 1 260px; display:flex; align-items:center; border:1px solid var(--line); background:var(--panel); padding:0 12px}
.search span{color:var(--accent); margin-right:8px}
.search input{flex:1; min-width:0; background:transparent; border:0; color:var(--text); font:inherit; padding:10px 0; outline:none}
.search:focus-within{outline:2px solid var(--focus); outline-offset:1px}
.search input::placeholder{color:var(--dim)}
.legend{display:flex; gap:14px; flex-wrap:wrap; color:var(--dim); font-size:13px}

/* tiers */
.t-LDR{color:var(--ldr)} .t-VET{color:var(--vet)} .t-REG{color:var(--reg)} .t-FNG{color:var(--fng)} .t-ASP{color:var(--asp)} .t-NONE{color:var(--dim)}
.tier{font-size:13px; white-space:nowrap; text-align:right}

/* sections */
.sec{margin-top:36px}
.sec-h{display:flex; align-items:baseline; gap:12px; margin:0 0 12px}
.sec-h h2{margin:0; font-size:26px; font-weight:600; letter-spacing:.08em; text-transform:uppercase}
.sec-h .desc{color:var(--dim); font-size:13px}
.sec-h::after{content:""; flex:1; border-top:1px solid var(--line); align-self:center; order:3}

.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.gridA{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px}

.card{border:1px solid var(--line); border-top:3px solid var(--u, var(--line)); background:var(--panel); padding:14px 16px; min-width:0}
.card h3{margin:0; font-size:28px; font-weight:700; letter-spacing:.08em; line-height:1.1; text-transform:uppercase}
.card h3 small{font-size:15px; letter-spacing:.06em; color:var(--dim); font-weight:600; margin-left:8px}
.card .tag{color:var(--dim); font-size:13px; margin-bottom:10px}
.card .fill{float:right; color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; margin-top:6px}
.cmd .rank{color:var(--accent); font-size:13px; letter-spacing:.04em}

.row{display:grid; grid-template-columns:44px minmax(0,1fr) auto 62px; gap:8px; padding:3px 6px; margin:0 -6px; border-left:2px solid transparent; align-items:baseline}
.row .role{color:var(--dim)}
.row .cs{overflow-wrap:anywhere}
.row .call{color:var(--dim); font-size:13px; white-space:nowrap; text-align:right}
.row .call i{display:block; font-style:normal; font-size:12px; opacity:.85}
.row.lead{border-left-color:var(--accent)}
.row.open .cs{color:var(--open); font-style:italic}
.row.hit{background:color-mix(in srgb, var(--accent) 18%, transparent); border-left-color:var(--accent)}
.row.dim{opacity:.28}

.team{margin-top:10px; padding-left:14px; border-left:1px solid var(--line); position:relative}
.team-h{color:var(--accent); margin-bottom:2px; font-size:14px}
.team-h span{color:var(--dim)}
.team::before{content:""; position:absolute; left:0; top:11px; width:8px; border-top:1px solid var(--line)}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line); background:var(--panel); padding:3px 10px; color:var(--asp)}
.chip.hit{outline:1px solid var(--accent); color:var(--text)}
.chip.dim{opacity:.28}

/* comms card */
.comms{border:1px solid var(--line); background:var(--panel); overflow-x:auto}
.comms table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; min-width:520px}
.comms th{text-align:left; color:var(--dim); font-weight:400; font-size:13px; padding:10px 14px; border-bottom:1px solid var(--line)}
.comms td{padding:5px 14px; border-bottom:1px solid color-mix(in srgb, var(--line) 55%, transparent)}
.comms td.num{text-align:right}
.comms th.num{text-align:right}
.comms .ch{display:flex; align-items:center; gap:10px}
.comms .sw{width:10px; height:10px; flex:none; background:var(--u)}
.comms tr.lvl0 td{color:var(--text)}
.comms tr.sub .ch{padding-left:20px}
.pri{white-space:nowrap}
.pri.flash{color:var(--asp)} .pri.imm{color:var(--accent)} .pri.rou{color:var(--dim)}

details{margin-top:34px; border:1px solid var(--line); background:var(--panel)}
summary{cursor:pointer; padding:12px 16px; list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"[+] "; color:var(--accent)}
details[open] summary::before{content:"[-] "}
summary:focus-visible{outline:2px solid var(--focus)}
.keys{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:2px 24px; padding:4px 16px 16px}
.keys div{display:grid; grid-template-columns:56px 1fr}
.keys div span{color:var(--accent)}
.note{color:var(--dim); font-size:13px; margin:8px 0 0}

footer{margin-top:40px; color:var(--dim); font-size:13px; border-top:1px solid var(--line); padding-top:14px}
footer .motto{color:var(--accent); margin:0 0 4px}
footer p{margin:2px 0}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid3,.grid2{grid-template-columns:1fr}
  .sec-h{flex-wrap:wrap}
}
@media (max-width:480px){
  .row{grid-template-columns:40px minmax(0,1fr) auto; font-size:14px}
  .row .tier{display:none}
  .card h3{font-size:24px}
}
</style>
</head>

  ["Hitman 3",40.8,40.6,"Immediate/Priority","#c9dde0"],["Hitman 3-1",40.4,40.2,"Priority/Routine","#c5d8f2",1],["Hitman 3-2",40,39.8,"Priority/Routine","#9dbcf0",1],["Hitman 3-3",39.6,39.4,"Priority/Routine","#6f9ae8",1]
];

var ASPIRANTS = ["Tickler","TheKushWizard","+Red+","THCloudz","Hatred","GRXXN","TwiiSTFAME","voixdv",
  "JFSmith09","UnknownNazzyyy","PastelPanduh","StarFins","Piloto","Hairryballz","viper2846","Snow",
  "BRAXYYY","66","! Miltoc","Aiden","Treto","Xavier","Dankttv"];

var ROLES = [
  ["CO","Commanding Officer"],["XO","Executive Officer"],["OPM","Operations Manager"],
  ["PL","Platoon Leader"],["PSG","Platoon Sergeant"],["RTO","Radio Telephone Operator"],["PM","Platoon Medic"],["APM","Assistant Platoon Medic"],
  ["SL","Squad Leader"],["FTL","Fireteam Leader"],["TL","Team Leader"],["AR","Automatic Rifleman"],["GR","Grenadier / Rifleman"],
  ["MRK","Marksman / Reserve"],["MED","Medic"],["AMED","Assistant Medic"],["CE","Combat Engineer"],
  ["MG","Machine Gunner"],["AMG","Assistant Machine Gunner"],["HAT","Heavy Anti-Tank"],
  ["RSL","Recon Squad Leader"],["RTL","Recon Team Leader (Spotter)"],["RSPC","Recon Specialist"],["RMED","Recon Specialist (Medic)"],["SNP","Sniper"],
  ["SC","Section Chief"],["ART","Artilleryman"],["CC","Crew Chief"],["CRW","Crewmember"],["MECH","Mechanic"],["ENG","Equipment Engineer"],
  ["DRN","Drone Operator"],["DT","Drone Technician"],
  ["CMO","Chief Medical OX"],["ECS","ECS"],["PJTL","Pararescue Team Leader"],["PJ","Pararescue Jumper"],["FM","Field Medic"],
  ["TTL","Trauma Team Leader"],["TTS","Trauma Team Surgeon"],["TTD","Trauma Team Driver"],["SOCM","Special Operations Combat Medic"]
];
/* ---------- END EDIT ---------- */

var TIER_LABEL = { LDR:"★ LDR", VET:"◆ VET", REG:"REG", FNG:"○ FNG", ASP:"ASP", NONE:"—", "":"" };
var LEAD = { CO:1, XO:1, OPM:1, PL:1, SL:1, RSL:1, CMO:1 };
var ROLE_NAME = {};
ROLES.forEach(function(r){ ROLE_NAME[r[0]] = r[1]; });
var TALLY = { slots:0, filled:0, names:{} };

function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function row(p, mirror){
  var open = !p[1];
  if (!open) TALLY.names[p[1]] = 1;
  if (!mirror && !p[5]){ TALLY.slots++; if (!open) TALLY.filled++; }   // a slot shown in two places (attached medics, PJTL) counts once
  var r = el("div", "row" + (LEAD[p[0]] ? " lead" : "") + (open ? " open" : ""));
  var role = el("span", "role", p[0]);
  if (ROLE_NAME[p[0]]) role.title = ROLE_NAME[p[0]];
  r.appendChild(role);
  r.appendChild(el("span", "cs", open ? "OPEN" : p[1]));
  var call = el("span", "call", p[2]);
  if (p[4]){ var at = el("i", null, "→ " + p[4]); call.appendChild(at); }
  r.appendChild(call);
  r.appendChild(el("span", "tier t-" + (p[3] || "NONE"), open ? "" : TIER_LABEL[p[3] || "NONE"]));
  r.dataset.find = (p[1] + " " + p[2] + " " + (p[4] || "")).toLowerCase();
  return r;
}

function section(title, desc){
  var s = el("section", "sec");
  var h = el("div", "sec-h");
  h.appendChild(el("h2", "hd", title));
  if (desc) h.appendChild(el("span", "desc", desc));
  s.appendChild(h);
  return s;
}

function teamCard(o){
  var c = el("div", "card");
  if (o.u) c.style.setProperty("--u", o.u);
  var filled = 0, total = 0;
  o.teams.forEach(function(t){ t.m.forEach(function(p){ total++; if (p[1]) filled++; }); });
  c.appendChild(el("span", "fill", filled + "/" + total));
  var h = el("h3", "hd", o.name);
  if (o.num) h.appendChild(el("small", null, o.num));
  c.appendChild(h);
  c.appendChild(el("div", "tag", o.tag));
  o.teams.forEach(function(t){
    var tm = el("div", "team");
    if (o.teams.length > 1 || t.name) tm.appendChild(el("div", "team-h", t.name));
    t.m.forEach(function(p){ tm.appendChild(row(p, o.mirror && !!p[4])); });
    c.appendChild(tm);
  });
  return c;
}

function hqCard(name, tag, rows, u){
  var c = el("div", "card");
  if (u) c.style.setProperty("--u", u);
  c.appendChild(el("h3", "hd", name));
  c.appendChild(el("div", "tag", tag));
  rows.forEach(function(p){ c.appendChild(row(p)); });
  return c;
}

function build(){
  var root = document.getElementById("root");

  // Command
  var s1 = section("D.A.G.R. Command", "Company leadership");
  var g1 = el("div", "grid3");
  COMMAND.forEach(function(p){
    var c = el("div", "card cmd");
    c.style.setProperty("--u", "var(--accent)");
    c.appendChild(el("div", "tag", p.title));
    c.appendChild(el("div", "rank", p.rank));
    c.appendChild(row([p.pos, p.name, p.cs, p.tier]));
    g1.appendChild(c);
  });
  s1.appendChild(g1);
  root.appendChild(s1);

  // Hitman
  var s2 = section("Hitman Platoon", "SSO assault group");
  var hq = hqCard("Hitman Command", "Platoon HQ", HITMAN.hq, "#b36214");
  hq.style.marginBottom = "12px";
  s2.appendChild(hq);
  var g2 = el("div", "grid2");
  HITMAN.squads.forEach(function(sq){ g2.appendChild(teamCard(sq)); });
  s2.appendChild(g2);
  root.appendChild(s2);

  // Whiplash + Anvil
  var s3 = section("Whiplash & Anvil", "Recon, fires, vehicles and drones");
  var g3 = el("div", "grid2");
  var wl = teamCard(WHIPLASH); wl.querySelector("h3").firstChild.textContent = "Whiplash";
  wl.querySelector("h3").appendChild(el("small", null, "Whiplash 1-1"));
  g3.appendChild(wl);
  g3.appendChild(hqCard("Anvil Command", "Support element HQ", ANVIL.hq, "#9c2415"));
  ANVIL.cards.forEach(function(cd){ g3.appendChild(teamCard(cd)); });
  s3.appendChild(g3);
  root.appendChild(s3);

  // Prophet
  var s4 = section("Prophet Command", "Medical, pararescue and trauma");
  var g4 = el("div", "grid2");
  g4.appendChild(hqCard("Prophet Command", "Medical HQ", PROPHET.hq, "#d9a7b8"));
  PROPHET.cards.forEach(function(cd){ cd.mirror = true; g4.appendChild(teamCard(cd)); });
  s4.appendChild(g4);
  var n4 = el("p", "note", "Oracle medics fill the Hitman medic slots and Avatar medics fill Bulwark's; the → shows where each one is attached. Acolyte's SOCM medics run with Whiplash.");
  s4.appendChild(n4);
  root.appendChild(s4);

  // Bulwark
  var s5 = section("Bulwark Platoon", "Second platoon, built like Hitman");
  var bhq = hqCard("Bulwark Command", "Platoon HQ", BULWARK.hq, "#b36214");
  bhq.style.marginBottom = "12px";
  s5.appendChild(bhq);
  var g5 = el("div", "grid2");
  BULWARK.squads.forEach(function(sq){ g5.appendChild(teamCard(sq)); });
  s5.appendChild(g5);
  root.appendChild(s5);

  // Comms card
  var s6 = section("Communications Card", "Primary (FQ) and secondary (SFQ) frequencies");
  var box = el("div", "comms"), tbl = el("table"), thead = el("thead"), hr = el("tr");
  [["Channel",""],["FQ","num"],["SFQ","num"],["Priority",""]].forEach(function(h){ var th = el("th", h[1], h[0]); th.scope = "col"; hr.appendChild(th); });
  thead.appendChild(hr); tbl.appendChild(thead);
  var tb = el("tbody");
  COMMS.forEach(function(c){
    var tr = el("tr", c[5] ? "sub" : "lvl0");
    var td = el("td"), ch = el("div", "ch"), sw = el("span", "sw");
    sw.style.setProperty("--u", c[4]); ch.appendChild(sw); ch.appendChild(el("span", null, c[0])); td.appendChild(ch); tr.appendChild(td);
    tr.appendChild(el("td", "num", c[1].toFixed(1)));
    tr.appendChild(el("td", "num", c[2].toFixed(1)));
    var cls = c[3].indexOf("Flash") === 0 ? "flash" : c[3].indexOf("Immediate") === 0 ? "imm" : "rou";
    var tdp = el("td"); tdp.appendChild(el("span", "pri " + cls, c[3])); tr.appendChild(tdp);
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); box.appendChild(tbl); s6.appendChild(box);
  root.appendChild(s6);

  // Aspirants
  var s7 = section("Aspirants", ASPIRANTS.length + " in selection");
  var chips = el("div", "chips");
  ASPIRANTS.forEach(function(n){ var c = el("span", "chip", n); c.dataset.find = n.toLowerCase(); chips.appendChild(c); });
  s7.appendChild(chips);
  root.appendChild(s7);

  // Stats
  var people = Object.keys(TALLY.names).length;
  var stats = [
    [people, "members slotted"],
    [TALLY.filled + "/" + TALLY.slots, "slots filled"],
    [ASPIRANTS.length, "aspirants"],
    [COMMS.length, "radio nets"]
  ];
  var sb = document.getElementById("stats");
  stats.forEach(function(s){
    var d = el("div", "stat");
    d.appendChild(el("div", "n", String(s[0])));
    d.appendChild(el("div", "l", s[1]));
    sb.appendChild(d);
  });

  // Role key
  var keys = document.getElementById("keys");
  ROLES.forEach(function(r){
    var d = el("div");
    d.appendChild(el("span", null, r[0]));
    d.appendChild(document.createTextNode(r[1]));
    keys.appendChild(d);
  });
}

function wireSearch(){
  var q = document.getElementById("q");
  q.addEventListener("input", function(){
    var v = q.value.trim().toLowerCase();
    document.querySelectorAll(".row, .chip").forEach(function(it){
      it.classList.remove("hit", "dim");
      if (!v) return;
      it.classList.add((it.dataset.find || "").indexOf(v) !== -1 ? "hit" : "dim");
    });
  });
}

build();
wireSearch();
</script>
</body>
</html>
